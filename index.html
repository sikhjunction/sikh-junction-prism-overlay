<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sikh Junction – PRISM 6:19 Overlay</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="overlay">
    <div class="top-gradient"></div>
    <div class="bottom-gradient"></div>

    <header class="brand-wrap">
      <div class="brand-rule"></div>
      <div class="brand">SIKH JUNCTION</div>
      <div class="brand-sub">LIVE • KEERTAN • KATHA • GURMAT • SAMAGAMS</div>
    </header>

    <section class="bottom-art" aria-hidden="true">

      

      
      <!-- PREMIUM CENTRED KHANDA -->
      <div class="khanda-feature" aria-hidden="true">
        <div class="khanda-orbit orbit-one"></div>
        <div class="khanda-orbit orbit-two"></div>
        <div class="khanda-rays"></div>
        <div class="khanda-glow"></div>
        <div class="khanda-center" role="img" aria-label="Khanda"></div>
        <div class="khanda-spark spark-1"></div>
        <div class="khanda-spark spark-2"></div>
        <div class="khanda-spark spark-3"></div>
        <div class="khanda-spark spark-4"></div>
      </div>

      <!-- BOTTOM ANNOUNCEMENT -->
      <div class="announcement-stage" aria-live="polite">
        <div id="announcementCard" class="announcement-card">
          <div class="fold fold-left"></div>
          <div class="fold fold-right"></div>
          <div class="announcement-inner">
            <span id="announcementIcon" class="announcement-icon">♥</span>
            <span id="announcementText" class="announcement-text">LIKE</span>
          </div>
        </div>
      </div>

      

      <div class="bottom-brand">
        <span class="live-dot"></span>
        <span>SIKH JUNCTION</span>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
